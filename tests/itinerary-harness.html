<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Itinerary builder test</title><style>body{font:14px system-ui;margin:20px;max-width:850px;color:#1b382b}button,select,input{font:inherit;padding:7px;border:1px solid #cbd8cd;border-radius:7px}.itinerary-toolbar,.itinerary-totals,.itinerary-day-header,.itinerary-add-pin,.itinerary-create-route,.itinerary-stop-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.itinerary-toolbar{margin-bottom:8px}.itinerary-total-card{border:1px solid #d5e0d5;border-radius:8px;padding:9px;flex:1;min-width:190px;display:grid;gap:4px}.itinerary-day{border:1px solid #d5e0d5;border-radius:9px;padding:10px;margin:10px 0}.itinerary-stop-list{padding-left:20px}.itinerary-stop{display:flex;align-items:center;gap:8px;padding:8px;margin:5px 0;border:1px solid #d5e0d5;border-radius:8px;background:#fff}.itinerary-stop-main{display:grid;flex:1;gap:3px}.itinerary-leg{list-style:none;margin:5px 0 8px -20px;padding:8px;background:#f1f6f0;border-radius:8px;display:grid;gap:7px}.itinerary-leg select{width:100%}.itinerary-custom-form{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.itinerary-custom-form input{min-width:100px;flex:1}.itinerary-save-state,.itinerary-stop-meta,.itinerary-leg-status,.itinerary-total-note{font-size:11px;color:#627365}.itinerary-create-route{display:flex}</style></head><body><h1>Itinerary builder</h1><p id="savedCount">0 saved</p><div id="builder"></div><script type="module">
import {createItinerary,createPinStop,addStopToItinerary,createCustomStop,addItineraryDay,moveItineraryStop,setItineraryLegRoute,setItineraryLegOption,saveSavedItineraries,deleteSavedItinerary,renderItineraryBuilder} from "../itinerary.mjs";
const pins=[{id:"pin-a",title:"Hanoi",lat:21.0285,lng:105.8542,icon:"📍"},{id:"pin-b",title:"Ninh Binh",lat:20.25,lng:105.97,icon:"🏞️"},{id:"pin-c",title:"Da Nang",lat:16.05,lng:108.2,icon:"🏖️"}];
const route={id:"route-a-b",mode:"bus",modeLabel:"Bus",from:{id:"pin-a",title:"Hanoi"},to:{id:"pin-b",title:"Ninh Binh"},distanceMeters:90000,durationSeconds:7500,approximate:true,timeBasis:"Typical-speed estimate",research:{options:[{id:"bus-fare",modeLabel:"Bus",operatorLabel:"Test Bus",durationSeconds:7200,fare:{amount:180000,currency:"VND"}}]}};
let draft=createItinerary("Vietnam sampler","2026-12-01"),saved=[],activeId=null,deletePendingId=null,dirty=true;const day=draft.days[0];draft=addStopToItinerary(draft,day.id,createPinStop(pins[0]));draft=addStopToItinerary(draft,day.id,createPinStop(pins[1]));const root=document.querySelector("#builder");
function render(){document.querySelector("#savedCount").textContent=saved.length+" saved";renderItineraryBuilder(root,{draft,saved,pins,routes:[route],activeId,deletePendingId,dirty,actions:{
selectSaved(id){const x=saved.find(i=>i.id===id);if(x){draft=JSON.parse(JSON.stringify(x));activeId=id;dirty=false;render();}},
newItinerary(){draft=createItinerary("New trip","2026-12-01");activeId=null;deletePendingId=null;dirty=true;render();},
save(){saved=[...saved.filter(i=>i.id!==draft.id),draft];activeId=draft.id;deletePendingId=null;dirty=false;saveSavedItineraries(saved);render();},
delete(id){if(deletePendingId!==id){deletePendingId=id;render();return;}const result=deleteSavedItinerary(saved,id);if(!result.ok)throw Error("Saved itinerary deletion failed: "+result.reason);saved=result.itineraries;activeId=null;deletePendingId=null;draft=createItinerary("New trip","2026-12-01");dirty=false;render();},
cancelDelete(){deletePendingId=null;render();},
nameChange(v){draft={...draft,name:v};dirty=true;render();},
addDay(){draft=addItineraryDay(draft);dirty=true;render();},
removeDay(){},
dayDateChange(id,date){draft={...draft,days:draft.days.map(d=>d.id===id?{...d,date}:d)};dirty=true;render();},
addPin(id,pinId){draft=addStopToItinerary(draft,id,createPinStop(pins.find(p=>p.id===pinId)));dirty=true;render();},
addCustomStop(id,n,lat,lng){draft=addStopToItinerary(draft,id,createCustomStop(n,lat,lng));dirty=true;render();},
removeStop(id,stopId){const d=draft.days.find(d=>d.id===id);draft={...draft,days:draft.days.map(x=>x.id===id?{...x,stops:x.stops.filter(s=>s.id!==stopId),legs:[]}:x)};dirty=true;render();},
moveStop(from,id,to,before){draft=moveItineraryStop(draft,from,id,to,before);dirty=true;render();},
selectRoute(id,from,to,routeId){draft=setItineraryLegRoute(draft,id,from,to,routeId==="route-a-b"?route:null);dirty=true;render();},
selectOption(id,from,to,r,optionId){draft=setItineraryLegOption(draft,id,from,to,r,optionId);dirty=true;render();},
createRoute(){}
}});}
window.forceItineraryRender=render;
render();
</script></body></html>
