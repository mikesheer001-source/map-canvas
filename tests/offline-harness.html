<html lang="en"><head><meta charset="utf-8"><title>Map Canvas offline browser test</title></head>
<body><h1>Offline browser test</h1><p id="ready">Loading</p>

import { enqueueOfflineChange, listQueuedChanges, removeQueuedChange, listOfflineAreas, removeOfflineAreaRecord } from "../offline-store.mjs?v=offline-areas-20261127";

await navigator.serviceWorker.ready;
if (!navigator.serviceWorker.controller) {
  await new Promise(resolve => navigator.serviceWorker.addEventListener("controllerchange", resolve, { once: true }));
}

  enqueueOfflineChange, listQueuedChanges, removeQueuedChange, listOfflineAreas, removeOfflineAreaRecord
};
document.getElementById("ready").textContent = "ready";
