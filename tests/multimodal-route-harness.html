<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multimodal route browser test</title><style>body{font:15px system-ui;margin:24px;max-width:760px;color:#18392f}button,select{padding:8px 12px;margin:4px;border:1px solid #cbd8cd;border-radius:7px;background:#fff}#map{height:280px;border:1px solid #ccd9cf;border-radius:9px;margin:12px 0}#map svg{width:100%;height:100%}.route-line{fill:none;stroke-width:5;cursor:pointer;stroke-linecap:round}.route-line.bus{stroke:#d28a21;stroke-dasharray:4 6}.route-line.train{stroke:#8658b5;stroke-dasharray:10 5}.route-line.flight{stroke:#397bd2;stroke-dasharray:4 6}.route-line.ferry{stroke:#0b91a9;stroke-dasharray:12 5}.route-line.driving{stroke:#23865b}.route-info{padding:12px;background:#edf5ed;border-radius:8px}</style></head><body><h1>Multimodal route test</h1><label>Mode <select id="mode"><option value="bus">Bus</option><option value="train">Train</option><option value="flight">Flight</option><option value="ferry">Ferry</option><option value="driving">Driving</option></select></label><button id="add">Add route</button><p id="status" role="status">Choose a mode and add a route.</p><div id="map"><svg viewBox="0 0 600 220"></svg></div><section id="info" class="route-info" hidden></section><script type="module">
import {buildMultimodalRoute,formatTransportDistance,formatTransportDuration} from "../multimodal-routes.mjs";
const from={id:"from",title:"Origin",lat:21,lng:105},to={id:"to",title:"Destination",lat:21.02,lng:105.03},svg=document.querySelector("#map svg"),status=document.querySelector("#status"),info=document.querySelector("#info");
function showInfo(r){info.hidden=false;info.textContent=r.modeLabel+" · "+formatTransportDistance(r.distanceMeters)+" · "+formatTransportDuration(r.durationSeconds)+" · "+r.geometryLabel;}
document.querySelector("#add").addEventListener("click",async()=>{const mode=document.querySelector("#mode").value;status.textContent="Looking up "+mode+" route…";const r=await buildMultimodalRoute({id:"test-"+mode,mode,from,to});const pts=r.geometry.coordinates.map(([lng,lat])=>[30+(lng-105)*12000,20+(lat-21)*6000]);const d=pts.map(([x,y],i)=>(i?"L":"M")+x.toFixed(1)+" "+(200-y).toFixed(1)).join(" ");const line=document.createElementNS("http://www.w3.org/2000/svg","path");line.setAttribute("d",d);line.setAttribute("class","route-line "+mode);line.addEventListener("click",()=>showInfo(r));svg.replaceChildren(line);status.textContent="Route ready.";});
</script></body></html>
