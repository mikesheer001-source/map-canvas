name: Test map pin coordinates

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend/**'
      - 'package.json'
      - 'scripts/build.mjs'
      - 'tests/database-browser.test.mjs'
      - '.github/workflows/test-map-canvas-database.yml'
      - '.github/workflows/test-pin-tracking.yml'
      - 'app.js'
      - 'enhancements.js'
      - 'index.html'
      - 'style.css'
      - 'sw.js'
      - 'offline-store.mjs'
      - 'offline-tiles.mjs'
      - 'tests/offline-*'
      - 'README.md'
      - '.github/workflows/test-map-canvas-offline.yml'
  pull_request:

permissions:
  contents: read

jobs:
  pin-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify coordinate tracking, features and fallback logic
        run: |
          node tests/pin-regression.test.mjs
          node tests/features.test.mjs
          node tests/canvas-features.test.mjs

  browser-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test dependencies
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium webkit
      - name: Run real-browser geometry tests
        run: |
          mkdir -p test-artifacts
          python3 -m http.server 8765 --bind 127.0.0.1 &
          node tests/pin-browser.test.mjs
          MAP_BROWSER_ENGINE=webkit node tests/pin-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pin-browser-screenshots
          path: test-artifacts/*.png
          if-no-files-found: ignore
