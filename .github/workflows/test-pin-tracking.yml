name: Test map pin coordinates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pin-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify coordinate tracking, features and fallback logic
        run: |
          node tests/pin-regression.test.mjs
          node tests/features.test.mjs
          node tests/canvas-features.test.mjs

  browser-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run real-browser geometry tests
        env:
          MAP_BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          mkdir -p test-artifacts
          python3 -m http.server 8765 --bind 127.0.0.1 &
          node tests/offline-browser.test.mjs
          node tests/pin-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pin-browser-screenshots-${{ matrix.engine }}
          path: test-artifacts/*.png
          if-no-files-found: ignore
