name: Test map pin coordinates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pin-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify coordinate tracking and fallback logic
        run: node tests/pin-regression.test.mjs

  browser-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test dependencies
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Run real-browser geometry tests
        run: |
          mkdir -p test-artifacts
          python3 -m http.server 8765 --bind 127.0.0.1 &
          node tests/pin-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pin-browser-screenshots
          path: test-artifacts/*.png
          if-no-files-found: ignore
