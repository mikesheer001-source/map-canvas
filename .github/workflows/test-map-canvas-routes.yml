name: Map Canvas route optimization checks

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'route-optimizer.mjs'
      - 'multimodal-routes.mjs'
      - 'tests/multimodal-routes.test.mjs'
      - 'tests/multimodal-route-harness.html'
      - 'tests/multimodal-routes.browser.test.mjs'
      - 'transport-options.mjs'
      - 'tests/transport-options.test.mjs'
      - 'tests/transport-options-harness.html'
      - 'tests/transport-options.browser.test.mjs'
      - 'itinerary.mjs'
      - 'tests/itinerary.test.mjs'
      - 'tests/itinerary-harness.html'
      - 'tests/itinerary.browser.test.mjs'
      - 'tests/route-optimizer.test.mjs'
      - 'tests/route-harness.html'
      - 'tests/route-optimizer.browser.test.mjs'
      - 'multimodal-routes.mjs'
      - 'tests/multimodal-routes.test.mjs'
      - 'tests/multimodal-route-harness.html'
      - 'tests/multimodal-routes.browser.test.mjs'
      - 'transport-options.mjs'
      - 'tests/transport-options.test.mjs'
      - 'tests/transport-options-harness.html'
      - 'tests/transport-options.browser.test.mjs'
      - 'itinerary.mjs'
      - 'tests/itinerary.test.mjs'
      - 'tests/itinerary-harness.html'
      - 'tests/itinerary.browser.test.mjs'
      - 'package.json'
      - 'scripts/build.mjs'
      - '.github/workflows/test-map-canvas-routes.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'route-optimizer.mjs'
      - 'tests/route-optimizer.test.mjs'
      - 'tests/route-harness.html'
      - 'tests/route-optimizer.browser.test.mjs'
      - 'package.json'
      - 'scripts/build.mjs'
      - '.github/workflows/test-map-canvas-routes.yml'

permissions:
  contents: read

jobs:
  route-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete Node test suite
        run: npm test
      - name: Validate build
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Run targeted route optimization browser tests
        run: npm run test:route:browser
      - name: Run targeted multimodal route browser tests
        run: npm run test:multimodal:browser
      - name: Run targeted transport-options popup browser tests
        run: npm run test:transport-options:browser
      - name: Run targeted itinerary builder browser tests
        run: npm run test:itinerary:browser
