name: Prepare offline map assets for review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: map-canvas-offline-assets-review
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/offline-area-download'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and verify self-hosted assets
        run: bash scripts/build-offline-basemap.sh
      - name: Update the offline review branch
        run: |
          git add vendor data/offline
          if git diff --staged --quiet; then exit 0; fi
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Add verified Hanoi basemap and offline renderer assets'
          git push origin HEAD:refs/heads/fix/offline-area-download
